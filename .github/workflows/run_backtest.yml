name: Run Backtest

# Runs monthly (1st of the month, 03:00 UTC) per the "re-run periodically"
# guidance in backtest_engine.py's docstring, plus on-demand via
# workflow_dispatch when you want to add/change a setup definition.

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 1 * *'

jobs:
  backtest:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install yfinance pandas numpy
      - run: python caller/backtest_engine.py
      - name: Commit results
        run: |
          git config user.name  "Backtest Bot"
          git config user.email "bot@users.noreply.github.com"
          git add caller/backtest_results.json
          git diff --cached --quiet || git commit -m "Backtest results $(date -u +%Y-%m-%d)"
          git push
