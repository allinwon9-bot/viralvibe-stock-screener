name: ViralVibe Stock Screener

on:
  schedule:
    # ── All times UTC (IST = UTC + 5:30) ──
    # Weekdays only Mon-Fri

    - cron: '30 2 * * 1-5'   # 8:00 AM IST  — Morning Briefing
    - cron: '30 3 * * 1-5'   # 9:00 AM IST  — Pre Open
    - cron: '45 3 * * 1-5'   # 9:15 AM IST  — Market Open
    - cron: '0  4 * * 1-5'   # 9:30 AM IST  — Best Entry + Institutional
    - cron: '30 6 * * 1-5'   # 12:00 PM IST — Midday Review
    - cron: '30 8 * * 1-5'   # 2:00 PM IST  — Power Hour Prep + Institutional
    - cron: '30 9 * * 1-5'   # 3:00 PM IST  — Closing Analysis
    - cron: '0  10 * * 1-5'  # 3:30 PM IST  — EOD Scorecard

  workflow_dispatch:
    inputs:
      session:
        description: 'Session to run'
        required: true
        default: 'BEST_ENTRY'
        type: choice
        options:
          - MORNING_BRIEFING
          - PRE_OPEN
          - MARKET_OPEN
          - BEST_ENTRY
          - MIDDAY_REVIEW
          - POWER_HOUR_PREP
          - CLOSING_ANALYSIS
          - EOD_SCORECARD
      analysis_type:
        description: 'Analysis type'
        required: true
        default: 'both'
        type: choice
        options:
          - both
          - regular
          - institutional

jobs:
  run-screener:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Detect session label
        id: session
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "label=${{ github.event.inputs.session }}" >> $GITHUB_OUTPUT
            echo "atype=${{ github.event.inputs.analysis_type }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Match on which cron expression fired (github.event.schedule), not
          # on wall-clock time at execution. GitHub's schedule event commonly
          # fires several (sometimes 30-90+) minutes late under load. The old
          # exact-HHMM-vs-actual-run-time match silently fell through to the
          # MORNING_BRIEFING/regular default on any drift at all — which,
          # looking at run history, was true of most scheduled runs. That
          # default skips both the institutional-analysis step and the data
          # commit, so most sessions were mislabeled and most institutional
          # runs never happened. github.event.schedule is the literal cron
          # string that matched, so it's exact regardless of execution delay.
          case "${{ github.event.schedule }}" in
            "30 2 * * 1-5") echo "label=MORNING_BRIEFING" >> $GITHUB_OUTPUT; echo "atype=regular" >> $GITHUB_OUTPUT ;;
            "30 3 * * 1-5") echo "label=PRE_OPEN"         >> $GITHUB_OUTPUT; echo "atype=regular" >> $GITHUB_OUTPUT ;;
            "45 3 * * 1-5") echo "label=MARKET_OPEN"      >> $GITHUB_OUTPUT; echo "atype=regular" >> $GITHUB_OUTPUT ;;
            "0 4 * * 1-5")  echo "label=BEST_ENTRY"       >> $GITHUB_OUTPUT; echo "atype=both"    >> $GITHUB_OUTPUT ;;
            "30 6 * * 1-5") echo "label=MIDDAY_REVIEW"    >> $GITHUB_OUTPUT; echo "atype=regular" >> $GITHUB_OUTPUT ;;
            "30 8 * * 1-5") echo "label=POWER_HOUR_PREP"  >> $GITHUB_OUTPUT; echo "atype=both"    >> $GITHUB_OUTPUT ;;
            "30 9 * * 1-5") echo "label=CLOSING_ANALYSIS" >> $GITHUB_OUTPUT; echo "atype=regular" >> $GITHUB_OUTPUT ;;
            "0 10 * * 1-5") echo "label=EOD_SCORECARD"    >> $GITHUB_OUTPUT; echo "atype=regular" >> $GITHUB_OUTPUT ;;
            *)              echo "label=MORNING_BRIEFING" >> $GITHUB_OUTPUT; echo "atype=regular" >> $GITHUB_OUTPUT ;;
          esac
          echo "Matched cron '${{ github.event.schedule }}' -> $(cat $GITHUB_OUTPUT | tr '\n' ' ')"

      - name: Run regular analysis
        if: steps.session.outputs.atype == 'regular' || steps.session.outputs.atype == 'both'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SESSION_LABEL:      ${{ steps.session.outputs.label }}
        run: python main.py

      - name: Run institutional analysis
        if: steps.session.outputs.atype == 'institutional' || steps.session.outputs.atype == 'both'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          ANTHROPIC_API_KEY:  ${{ secrets.ANTHROPIC_API_KEY }}
          SESSION_LABEL:      ${{ steps.session.outputs.label }}
        run: python institutional_main.py

      - name: Commit session data
        if: |
          steps.session.outputs.label != 'EOD_SCORECARD' &&
          steps.session.outputs.label != 'MORNING_BRIEFING'
        run: |
          git config user.name  "ViralVibe Bot"
          git config user.email "bot@viralvibe.com"
          git stash
          git pull --rebase origin main
          git stash pop || true
          if [ -n "$(git status --porcelain data/)" ]; then
            git add data/
            git commit -m "📊 ${{ steps.session.outputs.label }} $(date -u +'%H:%M UTC')"
            git push
          fi
